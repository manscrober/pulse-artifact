[project]
name = "pulse"
version = "1.1.0"
description = "PULSE: probabilistic ICU trajectory simulation with B-spline outputs"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch==2.13.0",
    "numpy==2.3.4",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
# Only building the cohort from the MIMIC-IV database needs DuckDB.
cohort = ["duckdb==2.0.0"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
